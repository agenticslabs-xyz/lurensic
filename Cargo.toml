[workspace]
resolver = "2"
members = ["crates/kagami-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Agentics Labs <https://agenticslabs.xyz>"]
homepage = "https://agenticslabs.xyz"
repository = "https://github.com/agenticslabs-xyz/kagami"
rust-version = "1.80"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
