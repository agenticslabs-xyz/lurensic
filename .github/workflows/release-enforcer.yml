name: release-enforcer

# Builds kagami-enforcer for each platform when a tag such as
# enforcer-v0.1.0 is pushed, and attaches the binaries and their SHA-256
# checksums to a draft GitHub release for review before publishing.

on:
  push:
    tags: ['enforcer-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: kagami-enforcer-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: kagami-enforcer-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: kagami-enforcer-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: kagami-enforcer-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test -p kagami-enforcer
      - run: cargo build --release -p kagami-enforcer --target ${{ matrix.target }}
      - name: Collect binary and checksum
        shell: bash
        run: |
          mkdir dist
          src="target/${{ matrix.target }}/release/kagami-enforcer"
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.name }}"
          cd dist && (sha256sum "${{ matrix.name }}" 2>/dev/null || shasum -a 256 "${{ matrix.name }}") > "${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --repo "$GITHUB_REPOSITORY" --title "kagami-enforcer ${GITHUB_REF_NAME#enforcer-v}" --notes "Standalone enforcer for Kagami. Verify downloads against the .sha256 files."
