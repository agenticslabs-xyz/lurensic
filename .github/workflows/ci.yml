name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.node == 22
        run: cargo fmt --all --check
      - if: matrix.node == 22
        run: cargo clippy --all-targets -- -D warnings
      # The engine, the WebAssembly build and every JavaScript suite.
      - run: pnpm test
      # The example app on the Cloudflare Workers runtime, through wrangler dev.
      - if: matrix.node == 22
        run: pnpm smoke:workers
      # The tarballs npm would receive, for the compatibility jobs below.
      - if: matrix.node == 22
        run: |
          mkdir .pack
          for p in node express hono; do (cd packages/$p && pnpm pack --pack-destination ../../.pack); done
      - if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .pack/*.tgz
          include-hidden-files: true
          if-no-files-found: error

  # Installs the packed packages into a new project, the way users get them,
  # on every Node version the packages support, and on Bun and Deno.
  compat:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            checks: express5,express4,hono,cli,require,types,bundle
          - node: 22
            checks: express5,express4,hono,cli,require,types,bundle,bun,deno
          - node: 24
            checks: express5,express4,hono,cli,require,types,bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == 22
        uses: oven-sh/setup-bun@v2
      - if: matrix.node == 22
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: .pack
      - run: node scripts/compat.mjs --tarballs .pack --only ${{ matrix.checks }}
