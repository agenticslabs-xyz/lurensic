name = "hono-app"
main = "worker.mjs"
compatibility_date = "2025-09-01"

[vars]
LURENSIC_MODE = "protect"
LURENSIC_CONTAINMENT = "block"

# Optional. Lurensic uses a KV binding named LURENSIC_STORE by itself, so
# containment holds across every copy of the Worker and across deploys.
# Create the namespace with `npx wrangler kv namespace create LURENSIC_STORE`
# and put the id it prints here. `wrangler dev` uses a local store either way.
[[kv_namespaces]]
binding = "LURENSIC_STORE"
id = "replace-with-your-namespace-id"
