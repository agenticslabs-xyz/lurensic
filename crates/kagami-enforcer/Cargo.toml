[package]
name = "kagami-enforcer"
description = "Pushes machines that Kagami has contained to edge firewalls such as Cloudflare. One program for apps in any language."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kagami-enforcer"
path = "src/main.rs"

[dependencies]
kagami-core = { path = "../kagami-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
